name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: pytest

      - name: Construir imagem Docker
        run: docker build -t task-api .

      - name: Configurar credenciais AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login no Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Criar tag da imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag task-api:latest 229691749798.dkr.ecr.us-east-1.amazonaws.com/task-api:latest

      - name: Enviar imagem para o ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push 229691749798.dkr.ecr.us-east-1.amazonaws.com/task-api:latest